name: Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact master commit to verify before tagging
        required: true
        type: string
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    name: Build & Verify macOS DMG
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'release-test')
    runs-on: macos-26 # Apple Silicon (arm64) runner with Swift 6.4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require installer verification before tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERIFIED="$(gh run list --workflow release.yml --commit "$RELEASE_SHA" --event workflow_dispatch --status success --json databaseId --jq 'length')"
          test "$VERIFIED" -gt 0 || { echo "No successful installer verification for this commit. Run pnpm release publish before tagging." >&2; exit 1; }

      - name: Verify requested commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify release toolchain and version
        run: |
          test "$(uname -m)" = arm64
          swift --version
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION/.rc./-rc.}" != "${PACKAGE_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}" >&2
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before packaging
        run: |
          pnpm run changelog:check
          pnpm run test:release-workflow
          pnpm run test:installer
          pnpm exec vitest run

      - name: Verify updater lifecycle
        run: node scripts/verify_update_flow.mjs /tmp/pluto-update-flow.json

      - name: Build Native Runtimes
        run: pnpm run build-native

      - name: Build and Package DMG
        env:
          # In unsigned mode, electron-builder packages an ad-hoc / unsigned DMG
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # PR installer checks need the same ad-hoc signature as tagged builds.
          CSC_FOR_PULL_REQUEST: true
        run: |
          pnpm run prebuild
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --mac --publish never

      - name: Verify package and generate checksums
        run: |
          APP="release/${PACKAGE_VERSION}/mac-arm64/Pluto.app"
          DMG="release/${PACKAGE_VERSION}/Pluto-Mac-${PACKAGE_VERSION}-Installer.dmg"
          pnpm run package:verify-runtime -- "$APP"
          test -s "$DMG"
          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT" -quiet || true; rmdir "$MOUNT" || true' EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          pnpm run package:verify-runtime -- "$MOUNT/Pluto.app"
          pnpm run package:verify-setup -- "$MOUNT/Pluto.app"
          mkdir -p dist-release
          cp "$DMG" dist-release/
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -s "$NOTES" ]]; then
            cp "$NOTES" dist-release/release-notes.md
          elif [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != *.rc.* ]]; then
            echo "Missing release notes: $NOTES. Use pnpm release." >&2
            exit 1
          fi
          cd dist-release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Save verified installer
        uses: actions/upload-artifact@v7
        with:
          name: pluto-macos-dmg
          path: dist-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download verified installer
        uses: actions/download-artifact@v7
        with:
          name: pluto-macos-dmg
          path: dist-release

      - name: Verify downloaded checksum
        run: cd dist-release && shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist-release
