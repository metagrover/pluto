name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release macOS DMG
    runs-on: macos-14 # Apple Silicon (arm64) runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved Tag: ${TAG} (Version: ${VERSION})"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Native Runtimes
        run: pnpm run build-native

      - name: Build and Package DMG
        env:
          # In unsigned mode, electron-builder packages an ad-hoc / unsigned DMG
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run prebuild
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --mac --publish never

      - name: Generate Checksums
        run: |
          mkdir -p dist-release
          cp release/*/*.dmg dist-release/ || cp release/*.dmg dist-release/ || true
          cd dist-release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If release already exists, upload assets to it; otherwise create a new release
          if gh release view "${RELEASE_TAG}" &>/dev/null; then
            echo "Release ${RELEASE_TAG} exists. Uploading artifacts..."
            gh release upload "${RELEASE_TAG}" dist-release/* --clobber
          else
            echo "Creating new release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" dist-release/* \
              --title "Pluto ${RELEASE_TAG}" \
              --generate-notes
          fi
