name: Release

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build & Verify macOS DMG
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'release-test')
    runs-on: macos-26 # Apple Silicon (arm64) runner with Swift 6.4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release toolchain and version
        run: |
          test "$(uname -m)" = arm64
          swift --version
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION/.rc./-rc.}" != "${PACKAGE_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}" >&2
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before packaging
        run: |
          pnpm run changelog:check
          pnpm run test:release-workflow
          pnpm exec vitest run

      - name: Build Native Runtimes
        run: pnpm run build-native

      - name: Build and Package DMG
        env:
          # In unsigned mode, electron-builder packages an ad-hoc / unsigned DMG
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run prebuild
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --mac --publish never

      - name: Verify package and generate checksums
        run: |
          APP="release/${PACKAGE_VERSION}/mac-arm64/Pluto.app"
          DMG="release/${PACKAGE_VERSION}/Pluto-Mac-${PACKAGE_VERSION}-Installer.dmg"
          pnpm run package:verify-runtime -- "$APP"
          pnpm run package:verify-setup -- "$APP"
          test -s "$DMG"
          mkdir -p dist-release
          cp "$DMG" dist-release/
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -s "$NOTES" ]]; then
            cp "$NOTES" dist-release/release-notes.md
          elif [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != *.rc.* ]]; then
            echo "Missing release notes: $NOTES. Use pnpm release." >&2
            exit 1
          fi
          cd dist-release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Save verified installer
        uses: actions/upload-artifact@v7
        with:
          name: pluto-macos-dmg
          path: dist-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@v7
        with:
          name: pluto-macos-dmg
          path: dist-release

      - name: Verify downloaded checksum
        run: cd dist-release && shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_FLAGS=()
          if [[ "${RELEASE_VERSION}" == *-* || "${RELEASE_VERSION}" == *.rc.* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          if [[ -s dist-release/release-notes.md ]]; then
            RELEASE_FLAGS+=(--notes-file dist-release/release-notes.md)
          else
            # Compatibility for historical tags created before pnpm release.
            RELEASE_FLAGS+=(--generate-notes)
          fi
          if gh release view "${RELEASE_TAG}" --json isDraft >/dev/null 2>&1; then
            if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" == false ]]; then
              echo "Release ${RELEASE_TAG} is already published."
              exit 0
            fi
            gh release upload "${RELEASE_TAG}" dist-release/*.dmg dist-release/SHA256SUMS.txt --clobber
            gh release edit "${RELEASE_TAG}" --draft=false
            exit 0
          fi
          gh release create "${RELEASE_TAG}" dist-release/*.dmg dist-release/SHA256SUMS.txt \
            --verify-tag \
            --title "Pluto ${RELEASE_TAG}" \
            "${RELEASE_FLAGS[@]}"
