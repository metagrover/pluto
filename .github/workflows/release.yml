name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build & Verify macOS DMG
    runs-on: macos-26 # Apple Silicon (arm64) runner with Swift 6.4
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release toolchain and version
        run: |
          test "$(uname -m)" = arm64
          swift --version
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION/.rc./-rc.}" != "${PACKAGE_VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}" >&2
              exit 1
            fi
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Native Runtimes
        run: pnpm run build-native

      - name: Build and Package DMG
        env:
          # In unsigned mode, electron-builder packages an ad-hoc / unsigned DMG
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run prebuild
          pnpm exec tsc
          pnpm exec vite build
          pnpm exec electron-builder --mac --publish never

      - name: Verify package and generate checksums
        run: |
          APP="release/${PACKAGE_VERSION}/mac-arm64/Pluto.app"
          DMG="release/${PACKAGE_VERSION}/Pluto-Mac-${PACKAGE_VERSION}-Installer.dmg"
          pnpm run package:verify-runtime -- "$APP"
          test -s "$DMG"
          mkdir -p dist-release
          cp "$DMG" dist-release/
          cd dist-release
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Save verified installer
        uses: actions/upload-artifact@v4
        with:
          name: pluto-macos-dmg
          path: dist-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@v4
        with:
          name: pluto-macos-dmg
          path: dist-release

      - name: Verify downloaded checksum
        run: cd dist-release && shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_FLAGS=()
          if [[ "${RELEASE_VERSION}" == *-* || "${RELEASE_VERSION}" == *.rc.* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" dist-release/* \
            --verify-tag \
            --title "Pluto ${RELEASE_TAG}" \
            --generate-notes "${RELEASE_FLAGS[@]}"
