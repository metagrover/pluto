name: Improvement
description: Describe a feature, refactor, or development improvement.
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Add relevant evidence, links, or boundaries if useful.
  - type: textarea
    id: verification
    attributes:
      label: How can we check it works?
    validations:
      required: true
  - type: textarea
    id: open_questions
    attributes:
      label: Open questions
      description: Record unresolved choices if there are any.
