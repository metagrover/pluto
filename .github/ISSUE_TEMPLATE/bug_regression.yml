name: Bug or regression
description: Report broken behavior.
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or evidence
      description: Include steps or relevant logs and screenshots. Omit private meeting data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Add severity, frequency, or affected workflows if useful.
